repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".github/.secrets.baseline"]

  # Local hooks
  - repo: local
    hooks:
      # Ruff - linting and formatting
      - id: ruff
        name: Ruff linting
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff formatting
        entry: uv run ruff format
        language: system
        types: [python]

      # Pyright - type checking
      - id: pyright
        name: Pyright type checking
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # Check for non-ASCII characters introduced by LLMs
      - id: check-llm-chars
        name: Check LLM characters
        entry: python .github/scripts/check_llm_chars.py
        language: system
        types: [text]
        files: \.(py|md|txt|json|mdc|sh)$
        exclude: ^(\.devconfig/|\.github/scripts/check_llm_chars\.py$)

      # Update requirements.txt from pyproject.toml
      - id: update-requirements
        name: Update requirements.txt
        entry: .github/scripts/update-requirements.sh
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
