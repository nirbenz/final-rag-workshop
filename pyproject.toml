[project]
name = "rag-workshop"
version = "0.5.0"
authors = [{ name = "Nir Ben-Zvi", email = "me@nirbenzvi.com" }]
description = "RAG Workshop - Chunking and Retrieval Strategies"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy==2.4.0",
    "pandas==2.2.2",
    "python-dotenv==1.1.0",
    "hydra-core==1.3.2",
    "tenacity==9.0.0",
    "tqdm==4.67.1",
    "termcolor==2.5.0",
    "loguru==0.7.3",
    "python-dateutil>=2.9.0.post0",
    "pydantic==2.11.7",
]

[project.optional-dependencies]
[project.scripts]
task-runner = "poethepoet:main"

[dependency-groups]
task_runner = ["poethepoet==0.37.0"]
dev = [
    "auditwheel==6.4.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pyright==1.1.408",
    "watchdog>=6.0.0",
    "ruff==0.8.4",
]
text = [
    "bs4==0.0.2",
    "tiktoken==0.12.0",
    "pydantic-ai==1.42.0",
    "genai-prices>=0.0.49",
]
visualization = ["kaleido>=1.1.0", "nicegui>=3.3.1", "plotly==6.5.0"]
workshop = [
    "whatstk==0.8.1",
    "qdrant-client>=1.16.2",
]
others = []

[tool.poe.tasks]
pull-env = { shell = "scripts/install.sh" }

[tool.uv]
package = true
required-version = ">=0.9.0"
default-groups = ["text", "visualization", "dev", "workshop"]
override-dependencies = ["numpy==2.1.3"]

[tool.ruff]
extend = "ruff.toml"

# NOTE: For packaged modules, use hatchling.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop", "src/nicegui_app"]
